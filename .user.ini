; =============================================================
; PHP-FPM per-directory config untuk Nanya Events
; Copy juga ada di public/.user.ini (document root)
; =============================================================

; === Temporary Directory (KRITIS untuk POST/Upload) ===
; Pakai /tmp langsung karena storage/ sering read-only di CWP
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; === Upload & POST Limits ===
post_max_size = 20M
upload_max_filesize = 20M
max_file_uploads = 10

; === Session ===
session.save_path = /tmp
